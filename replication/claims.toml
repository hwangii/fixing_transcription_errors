# CLAIM REGISTRY: every empirical number and exhibit in the draft, and where it comes from.
#
# check_claims.py reads this file, finds each `text` in the draft, pulls the numbers out
# of it in order, and compares each with the matching entry of `values`, rounded to the
# precision the draft prints. Nothing here edits the draft.
#
# Fields
#   id       short unique name
#   text     an exact substring of the draft (TOML '...' strings are literal: \% stays \%)
#   values   one entry per number in `text`, in order. Each is an expression over
#              - result keys written by repnum into replication/results/*.tex
#              - cell("<table in paper repo>", "<row label>", <column>[, <nth>])   (column 1 = first number;
#                nth picks the nth row with that label, default 1)
#              - contra("<deaglan table>", <column>)  = 100 * contradicted / all pairs in that column
#            or "" to leave that number unchecked (a year, an age cutoff, a parameter).
#   assert   optional: an expression that must be true (for claims with no single number)
#   status   scripted  produced by a script in this repo: CODE/ (machine A) or LINKAGE/ (machine B)
#            table     read off an exhibit .tex that a script in CODE/ or LINKAGE/ writes
#            nocode    no producing code exists anywhere in the package -- UNVERIFIABLE
#   script   the producing script
#   machine  A = holds the transcription data (ARTS-ECON-CM); B = holds Deaglan's package
#   issue    a known problem with the claim, reported every run until it is resolved
#
# When the draft is edited, the checker reports TEXT NOT FOUND for any claim whose
# wording changed. Update `text` here at the same time; that is the point of the file.

draft = "DHTS-2026-10-12.tex"

[machines.ARTS-ECON-CM]
paper_repo = "D:/repos/6638fa0fd89fbec05130caeb"

